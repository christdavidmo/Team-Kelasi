# docker-compose.yml — Version Supabase
# ⚠️  Toutes les valeurs sensibles vont dans .env (jamais commitées)

version: '3.9'

services:

  # ── 1. Redis 7 ──────────────────────────────────────────────────────────────
  # Inchangé — Supabase ne fournit pas Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Backend FastAPI ───────────────────────────────────────────────────────
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # ✏️  Remplace l'ancienne URL locale postgresql://postgres:...@db:5432/...
      # Transaction pooler Supabase (recommandé pour FastAPI/SQLAlchemy)
      DATABASE_URL: ${SUPABASE_DATABASE_URL}

      REDIS_URL: redis://redis:6379/0

      # ➕ Nouvelles variables Supabase pour le backend
      SUPABASE_URL:              ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      # ✏️  "db" supprimé — plus de conteneur PostgreSQL local
      redis:
        condition: service_healthy

  # ── 3. Frontend React ────────────────────────────────────────────────────────
  frontend:
    build: ./Frontend
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # ➕ Exposées au client React (préfixe VITE_ si Vite, REACT_APP_ si CRA)
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    depends_on:
      - backend

# ✏️  Volume postgres_data supprimé — plus de DB locale
volumes: {}
