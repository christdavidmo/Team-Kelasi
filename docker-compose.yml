version: '3.8'

services:

  # 1. La Base de données
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: Skula_BD
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ↓ AJOUT : exécute automatiquement init.sql au premier démarrage
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d Skula_BD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 2. Le Backend Django
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app  # Permet le rechargement à chaud (hot-reload)
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy  # ↑ MODIFIÉ : attend que la DB soit prête
    environment:
      # ↓ CORRIGÉ : ma_base_de_donnees → Skula_BD
      - DATABASE_URL=postgres://admin:password123@db:5432/Skula_BD

  # 3. Le Frontend React
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Évite d'écraser les modules installés dans le conteneur
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true  # Aide au hot-reload sur certains OS

volumes:
  postgres_data:
