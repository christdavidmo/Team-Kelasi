version: '3.8'

services:
  # 1. La Base de données
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: Skula_BD
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Le Backend Django
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app  # Permet le rechargement à chaud (hot-reload)
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://admin:password123@db:5432/ma_base_de_donnees

  # 3. Le Frontend React
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules # Évite d'écraser les modules installés dans le conteneur
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true # Aide au hot-reload sur certains OS

volumes:
  postgres_data:
